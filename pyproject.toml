[project]
name = "draftsmith"
version = "0.3.0"
description = "Floorplan scene-graph engine: LLM-agent drafting, synthetic datasets, DXF tooling"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Vedant Saboo", email = "vedantsaboo2001@gmail.com" }]
dependencies = [
    "ezdxf>=1.3",
    "matplotlib>=3.9",
    "shapely>=2.0",
]

[project.scripts]
draftsmith = "draftsmith.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/draftsmith"]
